<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Results</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; text-align: center; }
        .card { border: 1px solid #ccc; border-radius: 10px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .stat-box { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .stat-title { font-weight: bold; }
        .correct { color: #28a745; font-weight: bold; }
        .wrong { color: #dc3545; font-weight: bold; }
        .unattempted { color: #ffc107; font-weight: bold; }
        .accuracy { color: #17a2b8; font-weight: bold; }
        a { display: inline-block; margin-top: 20px; padding: 10px 15px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎉 Test Performance</h2>

        <div class="stat-box">
            <span class="stat-title">⏱️ Time Taken:</span>
            <span id="timeTaken">-</span>
        </div>
        <div class="stat-box">
            <span class="stat-title">🎯 Accuracy:</span>
            <span id="accuracy" class="accuracy">-</span>
        </div>
        <div class="stat-box">
            <span class="stat-title">✅ Correct Answers:</span>
            <span id="right" class="correct">-</span>
        </div>
        <div class="stat-box">
            <span class="stat-title">❌ Wrong Answers:</span>
            <span id="wrong" class="wrong">-</span>
        </div>
        <div class="stat-box">
            <span class="stat-title">⚠️ Unattempted:</span>
            <span id="unattempted" class="unattempted">-</span>
        </div>

        <a href="index.html">Retake Test</a>
    </div>

    <script>
        // Load data from localStorage
        const results = JSON.parse(localStorage.getItem("quizResults"));

        if (results) {
            document.getElementById("timeTaken").textContent = results.timeTaken;
            document.getElementById("accuracy").textContent = results.accuracy + "%";
            document.getElementById("right").textContent = results.right + " / " + results.total;
            document.getElementById("wrong").textContent = results.wrong;
            document.getElementById("unattempted").textContent = results.unattempted;
        } else {
            document.querySelector(".card").innerHTML = "<p>No test results found. Please take the test first!</p><a href='index.html'>Go to Test</a>";
        }
    </script>
</body>
</html>
